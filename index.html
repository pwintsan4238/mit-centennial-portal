                <h3 class="font-serif font-bold text-xl text-[#0F294A]">Inquiry Dispatched</h3>
                <p class="text-xs sm:text-sm text-slate-600 leading-relaxed">
                  Thank you for writing to Myanmar Institute of Theology. Your inquiry has been forwarded to admissions. An officer will respond within 24–48 business hours.
                </p>
                <button class="w-full py-2.5 rounded-sm bg-[#0F294A] text-white font-semibold text-xs hover:bg-slate-900 transition" onClick={() => setFormSubmitted(false)}>
                  Close Window
                </button>
              </div>
            </div>
          )}
        </main>
      );
    }

    // -------------------------------------------------------------
    // MAIN APP ROUTER COMPONENT
    // -------------------------------------------------------------
    function App() {
      return (
        <div class="min-h-screen flex flex-col justify-between">
          <NavigationBar />
          <div class="flex-grow">
            <Routes>
              <Route path="/" element={<HomePage />} />
              <Route path="/programs" element={<ProgramsPage />} />
              <Route path="/about" element={<AboutPage />} />
              <Route path="/events" element={<EventsPage />} />
              <Route path="/contact" element={<ContactPage />} />
              {/* Fallback route */}
              <Route path="*" element={<HomePage />} />
            </Routes>
          </div>
          <Footer />
        </div>
      );
    }

    // Top-level MemoryRouter wrap
    const container = document.getElementById('root');
    const root = createRoot(container);
    root.render(
      <MemoryRouter initialEntries={["/"]}>
        <App />
      </MemoryRouter>
    );
  </script>
</body>
</html>
